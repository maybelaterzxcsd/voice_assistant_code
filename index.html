<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Голосовой Ассистент</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 2rem auto; padding: 1rem; background: #f5f5f5; }
        .chat-container { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); min-height: 400px; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; max-height: 60vh; }
        .message { padding: 0.75rem 1rem; border-radius: 8px; max-width: 85%; line-height: 1.4; word-wrap: break-word; }
        .user { background: #007bff; color: white; align-self: flex-end; }
        .assistant { background: #e9ecef; color: #333; align-self: flex-start; white-space: pre-wrap; }
        .controls { display: flex; gap: 0.5rem; margin-top: 1rem; }
        input { flex: 1; padding: 0.75rem; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #007bff; }
        button { padding: 0.75rem 1.5rem; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: all 0.2s; font-weight: 500; white-space: nowrap; }
        #micBtn { background: #dc3545; color: white; }
        #micBtn.recording { background: #a71d2a; animation: pulse 1.5s infinite; }
        #sendBtn { background: #28a745; color: white; }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); } 50% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(220, 53, 69, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); } }
    </style>
</head>
<body>
    <h2>🎙️ Голосовой Ассистент</h2>
    <div class="chat-container" id="chatContainer">
        <div class="message assistant">Привет! Я готов помочь. Скажи или напиши, что нужно сделать.</div>
    </div>
    <div class="controls">
        <button id="micBtn">🎤 Говорить</button>
        <input type="text" id="textInput" placeholder="Или введите текст здесь...">
        <button id="sendBtn">➤</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const textInput = document.getElementById('textInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');

        let sessionId = localStorage.getItem('sessionId') || null;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        let isRecording = false;
        let finalTranscript = '';
        let silenceTimer = null;
        let noSpeechTimer = null;
        
        const SILENCE_TIMEOUT = 2500; 
        const NO_SPEECH_TIMEOUT = 5000; 

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onstart = () => {
                isRecording = true;
                finalTranscript = '';
                micBtn.textContent = '🛑 Слушаю...';
                micBtn.classList.add('recording');
                
                noSpeechTimer = setTimeout(() => {
                    if (isRecording && finalTranscript.trim() === '') {
                        recognition.stop();
                        isRecording = false;
                        micBtn.textContent = '🎤 Говорить';
                        micBtn.classList.remove('recording');
                    }
                }, NO_SPEECH_TIMEOUT);
            };

            recognition.onresult = (event) => {
                clearTimeout(noSpeechTimer);

                let interimTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + ' ';
                        
                        clearTimeout(silenceTimer);
                        
                        silenceTimer = setTimeout(() => {
                            if (finalTranscript.trim()) {
                                processAndSend(finalTranscript.trim());
                            }
                        }, SILENCE_TIMEOUT);
                    } else {
                        interimTranscript += transcript;
                    }
                }
                textInput.value = finalTranscript + interimTranscript;
            };

            recognition.onend = () => {
                if (isRecording) {
                    try { recognition.start(); } catch (e) {}
                } else {
                    micBtn.textContent = '🎤 Говорить';
                    micBtn.classList.remove('recording');
                }
            };

            recognition.onerror = (event) => {
                if (event.error === 'no-speech') {
                } else {
                    isRecording = false;
                    micBtn.textContent = '🎤 Говорить';
                    micBtn.classList.remove('recording');
                }
            };
        } else {
            micBtn.disabled = true;
            micBtn.textContent = '🎤 Не поддерживается';
        }

        micBtn.addEventListener('click', () => {
            if (!recognition) return;
            if (isRecording) {
                isRecording = false;
                recognition.stop();
                clearTimeout(silenceTimer);
                clearTimeout(noSpeechTimer);
                if (finalTranscript.trim()) {
                    processAndSend(finalTranscript.trim());
                }
            } else {
                finalTranscript = '';
                textInput.value = '';
                recognition.start();
            }
        });

        function processAndSend(text) {
            isRecording = false;
            recognition.stop();
            clearTimeout(silenceTimer);
            clearTimeout(noSpeechTimer);
            sendMessage(text);
            finalTranscript = '';
            textInput.value = '';
        }

        function handleManualSend() {
            const text = textInput.value.trim();
            if (text) {
                if (isRecording) {
                    isRecording = false;
                    recognition.stop();
                }
                clearTimeout(silenceTimer);
                clearTimeout(noSpeechTimer);
                sendMessage(text);
                textInput.value = '';
                finalTranscript = '';
            }
        }

        sendBtn.addEventListener('click', handleManualSend);
        textInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleManualSend();
        });

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.textContent = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage(text) {
            addMessage(text, 'user');
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, session_id: sessionId })
                });
                
                const data = await response.json();
                addMessage(data.response, 'assistant');
                
                if (data.session_id) {
                    sessionId = data.session_id;
                    localStorage.setItem('sessionId', sessionId);
                }
                
                speakText(data.response);
            } catch (error) {
                addMessage('Ошибка соединения с сервером.', 'assistant');
                console.error(error);
            }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ru-RU';
                utterance.rate = 1.0;
                const voices = window.speechSynthesis.getVoices();
                const ruVoice = voices.find(v => v.lang.includes('ru'));
                if (ruVoice) utterance.voice = ruVoice;
                window.speechSynthesis.speak(utterance);
            }
        }
        window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
    </script>
</body>
</html>
